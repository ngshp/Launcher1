name: Auto Upload to v1.0.104 Release FIXED

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Find csproj
        run: |
          Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object FullName

      - name: Build Launcher - CORRECT PATH
        run: |
          # Path yang bener dari README Bos!
          dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true -o publish /p:PublishSingleFile=true
        # Fallback if name different
        continue-on-error: false

      - name: Build Installer (7 Languages)
        run: |
          if (Test-Path "PBNG-Ecosystem/Launcher/PBNG-Setup.iss") {
            ISCC.exe "PBNG-Ecosystem/Launcher/PBNG-Setup.iss"
          } elseif (Test-Path "installer/PBNG-Setup.iss") {
            ISCC.exe "installer/PBNG-Setup.iss"
          } elseif (Test-Path "PBNG-Setup.iss") {
            ISCC.exe "PBNG-Setup.iss"
          } else {
            Write-Host "ISS not found, skipping installer build"
          }
        continue-on-error: true

      - name: Prepare Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Find exe from publish or Output
          $exe = Get-ChildItem -Recurse -Filter "PBNG-Setup*.exe" | Select-Object -First 1
          if ($exe) { 
            Copy-Item $exe.FullName -Destination "artifacts\PBNG-Setup-v1.0.104.exe" -Force 
            Write-Host "Found installer: $($exe.FullName)"
          } else {
            # Create dummy exe from publish folder for test
            Write-Host "No installer found, will zip only"
          }
          # Zip portable - 69 MB
          if (Test-Path "publish") {
            Compress-Archive -Path publish\* -DestinationPath artifacts\PBNG-Launcher-v1.0.104.zip -Force
          }

      - name: Upload to Release v1.0.104
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.104
          name: PBNG Launcher v1.0.104 - MULTILANG PRO MAX 🌍
          files: |
            artifacts/PBNG-Setup-v1.0.104.exe
            artifacts/PBNG-Launcher-v1.0.104.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
