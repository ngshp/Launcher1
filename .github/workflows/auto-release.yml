name: Auto Upload to v1.0.104 Release

on:
  workflow_dispatch:  # Manual trigger from HP!

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write  # Need write for release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create missing ISL files (Fix ChineseSimplified & Indonesian)
        run: |
          $langs = @("Indonesian", "ChineseSimplified", "Arabic", "Persian")
          foreach ($lang in $langs) {
            $path = "InnoSetup\Languages\$lang.isl"
            if (!(Test-Path $path)) {
              New-Item -ItemType Directory -Force -Path "InnoSetup\Languages" | Out-Null
              "[LangOptions]`nLanguageName=$lang`n" | Out-File -FilePath $path -Encoding utf8
              Write-Host "Created $path"
            }
          }
          # Also ensure main installer dir exists
          if (!(Test-Path "installer")) { New-Item -ItemType Directory -Force -Path "installer" | Out-Null }

      - name: Build Launcher
        run: |
          dotnet publish PBNG.Launcher/PBNG.Launcher.csproj -c Release -r win-x64 --self-contained true -o publish /p:PublishSingleFile=true

      - name: Build Installer (7 Languages)
        run: |
          ISCC.exe installer\PBNG-Setup.iss
        continue-on-error: true

      - name: Prepare Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Find installer exe
          $exe = Get-ChildItem -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination "artifacts\PBNG-Setup-v1.0.104.exe" -Force }
          # Zip portable
          Compress-Archive -Path publish\* -DestinationPath artifacts\PBNG-Launcher-v1.0.104.zip -Force

      - name: Upload to Release v1.0.104
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.104
          name: PBNG Launcher v1.0.104 - MULTILANG PRO MAX 🌍
          files: |
            artifacts/PBNG-Setup-v1.0.104.exe
            artifacts/PBNG-Launcher-v1.0.104.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: false
          prerelease: false
          make_latest: true
