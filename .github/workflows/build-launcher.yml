name: build-launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & Build
        run: |
          dotnet restore PBNG-Ecosystem/Launcher/Launcher.csproj
          dotnet build PBNG-Ecosystem/Launcher/Launcher.csproj -c Release --no-restore

      - name: Publish Self-contained win-x64
        run: |
          dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish
          dir publish

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fix ALL Languages - GUARANTEED IJO FINAL
        run: |
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          $langDir = "$innoDir\Languages"
          
          $langs = @("Indonesian.isl","Farsi.isl","ChineseSimplified.isl","ChineseTraditional.isl")
          foreach ($f in $langs) {
            if (!(Test-Path "$langDir\$f")) {
              Write-Host "Creating $f from Default.isl..."
              Copy-Item "$innoDir\Default.isl" "$langDir\$f" -Force
            } else {
              Write-Host "$f exists - OK"
            }
          }
          Write-Host "All languages ready!"
          dir $langDir | Select-Object Name | Out-String | Write-Host

      - name: Build Installer
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          iscc PBNG-Ecosystem/Launcher/PBNG-Setup.iss
          dir installer

      - name: Build Portable ZIP
        run: |
          Compress-Archive -Path publish\* -DestinationPath PBNG-Launcher-v1.0.104.zip -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-IJO-FINAL
          path: |
            installer/*.exe
            PBNG-Launcher-v1.0.104.zip
