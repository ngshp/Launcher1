name: build-launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & Build
        run: |
          dotnet restore PBNG-Ecosystem/Launcher/Launcher.csproj
          dotnet build PBNG-Ecosystem/Launcher/Launcher.csproj -c Release --no-restore

      - name: Publish Self-contained win-x64
        run: |
          dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish
          dir publish

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Missing Languages (ID, FR, RU, CN, AR, IR)
        run: |
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          dir $langDir
          
          # Download Indonesian (unofficial) if missing
          if (!(Test-Path "$langDir\Indonesian.isl")) {
            Write-Host "Downloading Indonesian.isl..."
            try {
              Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Indonesian.isl" -OutFile "$langDir\Indonesian.isl" -ErrorAction Stop
            } catch {
              Write-Host "Official Indonesian not found, creating fallback from English..."
              Copy-Item "$langDir\Default.isl" "$langDir\Indonesian.isl"
              # Replace English strings with Indonesian fallback
              (Get-Content "$langDir\Indonesian.isl") -replace 'English','Indonesian' | Set-Content "$langDir\Indonesian.isl"
            }
          }
          
          # Download Farsi if missing
          if (!(Test-Path "$langDir\Farsi.isl")) {
            Write-Host "Farsi.isl missing, trying Persian..."
            if (Test-Path "$langDir\Persian.isl") { Copy-Item "$langDir\Persian.isl" "$langDir\Farsi.isl" }
            else { Copy-Item "$langDir\Default.isl" "$langDir\Farsi.isl" }
          }
          
          # Check all required langs
          $required = @("French.isl","Russian.isl","ChineseSimplified.isl","Arabic.isl","Indonesian.isl","Farsi.isl")
          foreach ($f in $required) {
            if (Test-Path "$langDir\$f") { Write-Host "OK $f exists" } else { Write-Host "WARN $f still missing, will use Default" }
          }
          dir $langDir | Select-Object Name

      - name: Build Installer MULTILANG
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          iscc PBNG-Ecosystem/Launcher/PBNG-Setup.iss
          dir installer

      - name: Build Portable ZIP
        run: |
          Compress-Archive -Path publish\* -DestinationPath PBNG-Launcher-v1.0.104.zip -Force
          Get-Item PBNG-Launcher-v1.0.104.zip | Select-Object Name, Length

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-Multilang
          path: |
            installer/*.exe
            PBNG-Launcher-v1.0.104.zip
          retention-days: 7
