name: build-launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & Build
        run: |
          dotnet restore PBNG-Ecosystem/Launcher/Launcher.csproj
          dotnet build PBNG-Ecosystem/Launcher/Launcher.csproj -c Release --no-restore

      - name: Publish Self-contained win-x64
        run: |
          dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish
          dir publish

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Missing Languages (ID, FR, RU, CN, AR, IR)
        run: |
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          $langDir = "$innoDir\Languages"
          dir $langDir | Select-Object Name
          Write-Host "Checking Default.isl at $innoDir\Default.isl"
          if (Test-Path "$innoDir\Default.isl") { Write-Host "Default.isl FOUND" } else { Write-Host "Default.isl NOT FOUND"; dir $innoDir }
          
          # Indonesian - create from English if not exists
          if (!(Test-Path "$langDir\Indonesian.isl")) {
            Write-Host "Creating Indonesian.isl from English..."
            Copy-Item "$innoDir\Default.isl" "$langDir\Indonesian.isl" -Force
          }
          
          # Farsi - copy from Arabic or Default
          if (!(Test-Path "$langDir\Farsi.isl")) {
            Write-Host "Creating Farsi.isl..."
            if (Test-Path "$langDir\Arabic.isl") { Copy-Item "$langDir\Arabic.isl" "$langDir\Farsi.isl" -Force }
            else { Copy-Item "$innoDir\Default.isl" "$langDir\Farsi.isl" -Force }
          }
          
          Write-Host "Final languages:"
          dir $langDir | Where-Object { $_.Name -match "Indonesian|Farsi|French|Russian|Chinese|Arabic" } | Select-Object Name, Length

      - name: Build Installer MULTILANG
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          iscc PBNG-Ecosystem/Launcher/PBNG-Setup.iss
          dir installer

      - name: Build Portable ZIP
        run: |
          Compress-Archive -Path publish\* -DestinationPath PBNG-Launcher-v1.0.104.zip -Force
          Get-Item PBNG-Launcher-v1.0.104.zip | Select-Object Name, Length

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-Multilang
          path: |
            installer/*.exe
            PBNG-Launcher-v1.0.104.zip
          retention-days: 7
