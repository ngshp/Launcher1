name: Build PBNG Launcher v360 PRO + Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-launcher:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Launcher
        run: dotnet restore PBNG-Ecosystem/Launcher/Launcher.csproj

      - name: Publish launcher-v360 PRO
        run: dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -o publish/launcher-v360 --self-contained false /p:DebugType=None /p:DebugSymbols=false

      - name: List published files
        run: |
          dir publish/launcher-v360
          echo "--- Checking hero.png and icon ---"
          if (Test-Path "PBNG-Ecosystem/Launcher/hero.png") { echo "hero.png FOUND" } else { echo "hero.png NOT FOUND - upload hero.png!" }
          if (Test-Path "PBNG-Ecosystem/Launcher/pbng_icon.ico") { echo "pbng_icon.ico FOUND" } else { echo "pbng_icon.ico NOT FOUND" }

      - name: Copy hero and icon to publish
        run: |
          if (Test-Path "PBNG-Ecosystem/Launcher/hero.png") { Copy-Item "PBNG-Ecosystem/Launcher/hero.png" -Destination "publish/launcher-v360/" -Force }
          if (Test-Path "PBNG-Ecosystem/Launcher/pbng_icon.ico") { Copy-Item "PBNG-Ecosystem/Launcher/pbng_icon.ico" -Destination "publish/launcher-v360/" -Force }
          dir publish/launcher-v360

      - name: Upload launcher.exe artifact 196KB
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-v360-exe
          path: publish/launcher-v360/
          retention-days: 30

  build-installer:
    runs-on: windows-latest
    needs: build-launcher
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download launcher artifact
        uses: actions/download-artifact@v4
        with:
          name: PBNG-Launcher-v360-exe
          path: publish/launcher-v360/

      - name: Build PBNG-Setup-v1.0.105.exe 1-Klik
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Installer/installer.iss

      - name: Upload PBNG-Setup-v1.0.105.exe
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Setup-v1.0.105-exe
          path: publish/PBNG-Setup-v1.0.105.exe
          retention-days: 30
