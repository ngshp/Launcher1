name: build-launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Clean old workflows
        run: |
          if (Test-Path ".github/workflows/build.yml") { Remove-Item ".github/workflows/build.yml" -Force; Write-Host "Deleted old build.yml" }
          dir .github/workflows

      - name: Find csproj
        run: |
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object { Write-Host $_.FullName }

      - name: Restore & Build
        run: |
          dotnet restore PBNG-Ecosystem/Launcher/Launcher.csproj
          dotnet build PBNG-Ecosystem/Launcher/Launcher.csproj -c Release --no-restore

      - name: Publish Self-contained win-x64
        run: |
          dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish
          dir publish

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check Inno files
        run: |
          if (Test-Path "PBNG-Ecosystem/Launcher/PBNG-Setup.iss") { Write-Host "ISS found" } else { Write-Host "ISS NOT FOUND - skipping installer"; exit 0 }
          if (Test-Path "publish/Launcher.exe") { Write-Host "Launcher.exe found" } else { dir publish }

      - name: Build Installer
        run: |
          if (Test-Path "PBNG-Ecosystem/Launcher/PBNG-Setup.iss") {
            iscc PBNG-Ecosystem/Launcher/PBNG-Setup.iss
            if (Test-Path "installer/PBNG-Setup.exe") { Move-Item "installer/PBNG-Setup.exe" "installer/PBNG-Setup-v1.0.104.exe" -Force }
            dir installer
          } else {
            Write-Host "Skipping installer build - ISS not found"
            New-Item -ItemType Directory -Force -Path installer
            Copy-Item "publish/Launcher.exe" "installer/PBNG-Setup-v1.0.104.exe" -Force
          }

      - name: Build Portable ZIP
        run: |
          Compress-Archive -Path publish\* -DestinationPath PBNG-Launcher-v1.0.104.zip -Force
          Get-Item PBNG-Launcher-v1.0.104.zip | Select-Object Name, Length

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-Build-Fixed
          path: |
            installer/PBNG-Setup-v1.0.104.exe
            PBNG-Launcher-v1.0.104.zip
          retention-days: 7
