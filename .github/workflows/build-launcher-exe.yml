name: Build FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Siapkan Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "assets" -Force
          New-Item -ItemType Directory -Path "publish/all" -Force
          $pngFile = Get-ChildItem -Recurse -Filter "*.png" | Where-Object { $_.FullName -like "*ea9de755*" } | Select-Object -First 1
          if ($pngFile) { Copy-Item $pngFile.FullName -Destination "assets/logo.ico" -Force }

      - name: Publish Project
        shell: pwsh
        run: |
          # Cari file csproj
          $projFile = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          
          # Publish dengan mematikan ApplicationIcon secara paksa agar tidak error
          dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:ApplicationIcon="" -o ./publish/all
          
          # Cek hasil
          Write-Host "Isi folder publish/all:"
          Get-ChildItem -Path publish/all

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          # Panggil ISCC dengan path absolut agar tidak bingung
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-INSTALLER
          path: Output/*.exe
