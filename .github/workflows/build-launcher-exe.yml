name: Build FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Auto-Convert PNG to ICO
        shell: pwsh
        run: |
          # Cari file PNG bos
          $pngFile = Get-ChildItem -Recurse -Filter "ea9de755-8f6a-4bdf-9aa9-61ad9d79e0e0.png" | Select-Object -First 1
          if ($pngFile) {
            # Convert ke .ico menggunakan .NET System.Drawing
            Add-Type -AssemblyName System.Drawing
            $img = [System.Drawing.Image]::FromFile($pngFile.FullName)
            $icoPath = Join-Path $pngFile.DirectoryName "installer_icon.ico"
            $img.Save($icoPath, [System.Drawing.Imaging.ImageFormat]::Icon)
            $img.Dispose()
            Write-Host "Ikon berhasil dibuat di: $icoPath"
          }

      - name: Publish Projects
        shell: pwsh
        run: |
          $projects = @{"Launcher"="publish/launcher"; "GameClient"="publish/game"; "Server"="publish/server"}
          foreach ($key in $projects.Keys) {
            $projFile = Get-ChildItem -Recurse -Filter "*$key*.csproj" | Select-Object -First 1
            if ($projFile) {
              dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o $projects[$key]
            }
          }

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $issFile = Get-ChildItem -Recurse -Filter "*.iss" | Select-Object -First 1
          # Jalankan Inno Setup
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "$($issFile.FullName)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-INSTALLER
          path: Installer/*.exe
