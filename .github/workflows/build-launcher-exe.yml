name: Build FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Siapkan Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "assets" -Force
          New-Item -ItemType Directory -Path "publish/all" -Force
          New-Item -ItemType Directory -Path "Output" -Force
          
          # Cari file ikon .png atau .ico mana saja untuk aset installer
          $iconFile = Get-ChildItem -Recurse -Filter "*.ico" | Select-Object -First 1
          if (-not $iconFile) {
            $pngFile = Get-ChildItem -Recurse -Filter "*.png" | Select-Object -First 1
            if ($pngFile) { Copy-Item $pngFile.FullName -Destination "assets/logo.ico" -Force }
          } else {
            Copy-Item $iconFile.FullName -Destination "assets/logo.ico" -Force
          }

      - name: Publish Project
        shell: pwsh
        run: |
          $projFile = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          
          # Parameter /p:ApplicationIcon= dikosongkan untuk override .csproj
          dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:ApplicationIcon="" /p:GenerateRuntimeConfigurationFiles=true -o publish/all

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-INSTALLER
          path: Output/*.exe
