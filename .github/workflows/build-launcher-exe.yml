name: Build FULL 4 Files - Launcher + Game + Server + Installer - v1.0.105

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Auto-Convert and Copy Icons
        shell: pwsh
        run: |
          # Cari icon.png atau icon.ico
          $sourceIcon = Get-ChildItem -Recurse -Filter "icon.png" | Select-Object -First 1
          if (-not $sourceIcon) { $sourceIcon = Get-ChildItem -Recurse -Filter "icon.ico" | Select-Object -First 1 }
          
          if ($sourceIcon) {
            $projects = Get-ChildItem -Recurse -Filter "*.csproj"
            foreach ($proj in $projects) {
              $destFolder = Split-Path $proj.FullName
              $destIcon = "$destFolder\icon.ico"
              
              if ($sourceIcon.Extension -eq ".png") {
                Write-Host "Converting $($sourceIcon.Name) to ICO for $destFolder..."
                Add-Type -AssemblyName System.Drawing
                $img = [System.Drawing.Image]::FromFile($sourceIcon.FullName)
                # Resize ke 256x256 agar kualitas ikon tajam
                $bitmap = [System.Drawing.Bitmap]::new($img, 256, 256)
                $bitmap.Save($destIcon, [System.Drawing.Imaging.ImageFormat]::Icon)
                $img.Dispose()
                $bitmap.Dispose()
              } else {
                Copy-Item $sourceIcon.FullName -Destination $destIcon -Force
              }
            }
          } else {
            Write-Warning "File icon.png atau icon.ico tidak ditemukan!"
          }

      - name: Publish Projects
        shell: pwsh
        run: |
          $projects = @{"Launcher"="publish/launcher"; "GameClient"="publish/game"; "Server"="publish/server"}
          foreach ($key in $projects.Keys) {
            $projFile = Get-ChildItem -Recurse -Filter "*$key*.csproj" | Select-Object -First 1
            if ($projFile) {
              Write-Host "Publishing: $($projFile.FullName)"
              dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o $projects[$key]
            }
          }

      - name: Prepare Installer Files
        shell: pwsh
        run: |
          mkdir publish/all -Force
          Copy-Item publish/*/* -Destination publish/all/ -ErrorAction SilentlyContinue

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $issFile = Get-ChildItem -Recurse -Filter "*.iss" | Select-Object -First 1
          if ($issFile) {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "$($issFile.FullName)"
          } else {
            Write-Error "Gagal: File .iss tidak ditemukan!"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-FULL-v1.0.105-FINAL
          path: Installer/*.exe
