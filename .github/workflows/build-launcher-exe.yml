name: Build FULL 4 Files - Launcher + Game + Server + Installer - v1.0.105

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Projects
        shell: pwsh
        run: |
          $projects = @{"Launcher"="publish/launcher"; "Game"="publish/game"; "Server"="publish/server"}
          foreach ($key in $projects.Keys) {
            $projFile = Get-ChildItem -Recurse -Filter "*$key*.csproj" | Select-Object -First 1
            if ($projFile) {
              Write-Host "Publishing: $($projFile.FullName)"
              # Menggunakan perintah standar untuk menghindari error MSB1005
              dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o $projects[$key]
            }
          }

      - name: Prepare Installer Files
        shell: pwsh
        run: |
          mkdir publish/all -Force
          Copy-Item publish/*/* -Destination publish/all/ -ErrorAction SilentlyContinue
          if (Test-Path "Installer/Languages") {
            Copy-Item "Installer/Languages" -Destination "publish/all/" -Recurse
          }

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          # Memastikan file ada sebelum eksekusi
          if (Test-Path "Installer/NGPB.Installer.iss") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Installer/NGPB.Installer.iss"
          } else {
            Write-Error "File Installer/NGPB.Installer.iss tidak ditemukan!"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-FULL-v1.0.105-FINAL
          path: |
            *.exe
            publish/all/
