name: Build EXE + ZIP FULL
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup.NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Find csproj
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter "*.csproj" | Where-Object { $_.Name -like "*Launcher*" } | Select-Object -First 1
          echo "PROJ_PATH=$($proj.FullName)" >> $env:GITHUB_ENV
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish $env:PROJ_PATH -c Release -r win-x64 --self-contained true -o publish /p:PublishSingleFile=false
          Compress-Archive -Path publish/* -DestinationPath PBNG-Launcher-v1.0.104.zip -Force
      - name: Setup Inno + FIX ALL LANGUAGES (FINAL)
        shell: pwsh
        run: |
          choco install innosetup -y
          $langDir = "C:\Program Files (x86)\Inno Setup 6\Languages"
          $defaultIsl = "$langDir\Default.isl"
          $englishIsl = "$langDir\English.isl"

          # Download full language pack from official repo as zip
          Write-Host "Downloading full language pack..."
          try {
            Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/archive/refs/heads/main.zip" -OutFile "$env:TEMP\issrc.zip"
            Expand-Archive "$env:TEMP\issrc.zip" "$env:TEMP\issrc" -Force
            $srcLangs = Get-ChildItem "$env:TEMP\issrc\*\Files\Languages" -Filter "*.isl" -Recurse -ErrorAction SilentlyContinue
            foreach ($f in $srcLangs) {
              $dest = "$langDir\$($f.Name)"
              if (-not (Test-Path $dest)) {
                Copy-Item $f.FullName $dest -Force
                Write-Host "Copied $($f.Name)"
              }
            }
          } catch { Write-Host "Pack download failed, using fallback" }

          # FINAL FALLBACK: For ANY missing language referenced in.iss, clone English
          $issFile = Get-ChildItem -Recurse -Filter "*.iss" | Select-Object -First 1
          if ($issFile) {
            $matches = [regex]::Matches((Get-Content $issFile.FullName -Raw), 'Languages\\([A-Za-z0-9]+\.isl)')
            foreach ($m in $matches) {
              $langName = $m.Groups[1].Value
              $path = "$langDir\$langName"
              if (-not (Test-Path $path)) {
                Write-Host "STILL MISSING $langName - Cloning from Default.isl"
                Copy-Item $defaultIsl $path -Force -ErrorAction SilentlyContinue
                if (-not (Test-Path $path)) { Copy-Item $englishIsl $path -Force }
              }
            }
          }
          dir $langDir

      - name: Build EXE
        shell: pwsh
        run: |
          $iss = Get-ChildItem -Recurse -Filter "*.iss" | Select-Object -First 1
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss.FullName
          $exe = Get-ChildItem -Path $iss.DirectoryName -Filter "*.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "PBNG-Setup-v1.0.104.exe" -Force }
          dir PBNG-*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-FULL-v1.0.104
          path: |
            PBNG-Launcher-v1.0.104.zip
            PBNG-Setup-v1.0.104.exe
