name: Build FULL 4 Files - Launcher + Game + Server + Installer - v1.0.105

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Projects
        shell: pwsh
        run: |
          $projects = @{"Launcher"="publish/launcher"; "Game"="publish/game"; "Server"="publish/server"}
          foreach ($key in $projects.Keys) {
            $projFile = Get-ChildItem -Recurse -Filter "*$key*.csproj" | Select-Object -First 1
            if ($projFile) {
              Write-Host "Publishing: $($projFile.FullName)"
              dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o $projects[$key]
            }
          }

      - name: Prepare Installer Files
        shell: pwsh
        run: |
          # Buat folder penampung
          mkdir publish/all -Force
          
          # Copy semua hasil publish ke folder all
          Copy-Item publish/*/* -Destination publish/all/ -Force
          
          # Mencari file .ico di root atau folder Installer dan copy ke publish/all agar terbaca oleh Inno Setup
          $iconFile = Get-ChildItem -Recurse -Filter "icon.ico" | Select-Object -First 1
          if ($iconFile) {
            Copy-Item $iconFile.FullName -Destination "publish/all/icon.ico" -Force
            Write-Host "Ikon ditemukan dan disalin ke: publish/all/icon.ico"
          }

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          $issFile = Get-ChildItem -Recurse -Filter "*.iss" | Select-Object -First 1
          
          if ($issFile) {
            Write-Host "Memproses installer dengan file: $($issFile.FullName)"
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "$($issFile.FullName)"
          } else {
            Write-Error "Gagal: File .iss tidak ditemukan di repositori!"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-FULL-v1.0.105-FINAL
          # Mengambil file installer hasil build (biasanya muncul di folder root atau lokasi script iss)
          path: |
            *.exe
            Installer/*.exe
