name: Build FULL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write # Wajib ada supaya bisa bikin Release otomatis

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set Version
        shell: pwsh
        run: |
          $ver = "1.0.${{ github.run_number }}"
          echo "BUILD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Siapkan Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "assets" -Force
          New-Item -ItemType Directory -Path "publish/all" -Force
          New-Item -ItemType Directory -Path "Output" -Force
          
          $iconFile = Get-ChildItem -Recurse -Filter "*.ico" | Select-Object -First 1
          if ($iconFile) { Copy-Item $iconFile.FullName -Destination "assets/logo.ico" -Force }

      - name: Publish Project
        shell: pwsh
        run: |
          $projFile = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1
          dotnet publish "$($projFile.FullName)" -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:ApplicationIcon="" -o publish/all

      - name: Build Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-INSTALLER-v1.0.${{ github.run_number }}
          path: Output/*.exe

      - name: Auto-Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          files: Output/*.exe
          tag_name: v1.0.${{ github.run_number }}
          name: NGPB Enterprise v1.0.${{ github.run_number }}
          body: |
            ## Update NGPB Enterprise v1.0.${{ github.run_number }}
            - Build otomatis via GitHub Actions.
            - Installer otomatis tersedia untuk di-download.
          token: ${{ secrets.GITHUB_TOKEN }}
