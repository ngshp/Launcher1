name: Build PBNG ENTERPRISE v1.0.105 - Loading Screen + AntiCheat HWID IP Ban

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-enterprise:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Build Server NGPB-Server-Windows + Linux VPS
        run: |
          dotnet publish Server/NGPB.DedicatedServer.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish/server-win
          dotnet publish Server/NGPB.DedicatedServer.csproj -c Release -r linux-x64 --self-contained true /p:PublishSingleFile=true -o publish/server-linux
          echo "Server Windows 127.0.0.1:39190 + Linux VPS 0.0.0.0:39190 - Enterprise HWID IP Ban Ready!"
      
      - name: Build Game Client ngpb.exe Enterprise
        run: |
          dotnet publish GameClient/NGPB.Game.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish/game
          echo "Game Client ngpb.exe - RED Yard AUG A3 28/120 HP 100 AP 100 - 6 Panel UI"
      
      - name: Build Anti-Cheat Enterprise - HWID+IP+Name+Chat+Link
        run: |
          dotnet publish GameClient/Source/AntiCheat/Enterprise/NGPB.AntiCheat.Enterprise.csproj -c Release -r win-x64 --self-contained true -o publish/anticheat
          dotnet publish GameClient/Source/AntiCheat/NGPB.AntiCheat.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o publish/anticheat
          echo "Anti-Cheat Enterprise: Layer1 AutoClose, Layer2 Ban HWID IP, WH AimLock Warning 4x Ban, GM Name Filter, Toxic Chat, Link https://ngpb.nhg.one only!"
      
      - name: Create ZIPs Enterprise
        run: |
          Compress-Archive -Path publish/server-win/* -DestinationPath PBNG-Server-Windows-Enterprise-v1.0.105.zip -Force
          Compress-Archive -Path publish/server-linux/* -DestinationPath PBNG-Server-Linux-VPS-Enterprise-v1.0.105.zip -Force
          Compress-Archive -Path publish/game/* -DestinationPath PBNG-Game-ngpb-Enterprise-v1.0.105.zip -Force
          Compress-Archive -Path publish/anticheat/* -DestinationPath PBNG-AntiCheat-Enterprise-v1.0.105.zip -Force
          Compress-Archive -Path publish/* -DestinationPath PBNG-ENTERPRISE-ALL-IN-ONE-v1.0.105.zip -Force
          dir PBNG-*.zip
      
      - name: Release ENTERPRISE PRO MAX - Like 118 MB GREEN 1m 57s
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            publish/server-win/NGPB-Server-Windows.exe
            publish/server-linux/NGPB-Server
            publish/game/ngpb.exe
            publish/anticheat/NGPB.AntiCheat.exe
            publish/anticheat/NGPB.AntiCheat.Enterprise.dll
            PBNG-*.zip
          body: |
            ## PBNG ENTERPRISE v1.0.105 - LOADING SCREEN KEREN + ANTI-CHEAT ENTERPRISE PRO MAX
            
