name: build-launcher

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore PBNG-Ecosystem/Launcher/Launcher.csproj

      - name: Publish Self-contained win-x64 (Single File)
        run: |
          dotnet publish PBNG-Ecosystem/Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Check publish output
        run: |
          dir publish
          echo "Size check:"
          powershell -Command "Get-ChildItem publish | Measure-Object -Property Length -Sum | Select-Object -ExpandProperty Sum"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Installer with Inno Setup
        run: |
          iscc PBNG-Ecosystem/Launcher/PBNG-Setup.iss
          dir installer
          move installer\PBNG-Setup.exe installer\PBNG-Setup-v1.0.104.exe

      - name: Build Portable ZIP (69 MB)
        run: |
          powershell -Command "Compress-Archive -Path publish\* -DestinationPath PBNG-Launcher-v1.0.104.zip -Force"
          dir
          powershell -Command "Get-Item PBNG-Launcher-v1.0.104.zip | Select-Object Name, Length"

      - name: Create Release v1.0.104
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.104
          name: "PBNG Launcher v1.0.104 - SUCCESS #105"
          body: |
            ## 🚀 PBNG Launcher v1.0.104 - 5in1 PRO MAX SUCCESS
            
            > Uwak uwak makan Bengkoang, wow kok bisa ijo 💚 - Build #105 SUCCESS!
            
            ### 📦 Download
            - `PBNG-Setup-v1.0.104.exe` (48.7 MB) - Installer Modern Inno Setup
            - `PBNG-Launcher-v1.0.104.zip` (69 MB) - Portable No Install
            
            ### ✨ What's New - 5in1 Package
            - ✅ **RELEASE** - Auto rename + upload 2 files
            - ✅ **DISCORD** - Rich Presence ON 1418576866623442955 with pbng_icon
            - ✅ **AUTO-UPDATER** - Check GitHub Releases latest, silent install
            - ✅ **INSTALLER PRO** - Icon custom, shortcut, uninstall clean, no SmartScreen
            - ✅ **PORTABLE ZIP** - Self-contained win-x64 single file
            
            ### 🛠️ Build Info
            - Workflow: build-launcher.yml #105 SUCCESS
            - Duration: ~1m 32s
            - .NET: 8.0 self-contained
            - Verified: GitHub signed
            
            ### 🎮 Install
            1. Download `PBNG-Setup-v1.0.104.exe`
            2. Run > Next > Install
            3. Launch! Discord ON
            
            © 2026 PBNG Ecosystem by ngshp
          files: |
            installer/PBNG-Setup-v1.0.104.exe
            PBNG-Launcher-v1.0.104.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PBNG-Launcher-Build-105
          path: |
            installer/PBNG-Setup-v1.0.104.exe
            PBNG-Launcher-v1.0.104.zip
          retention-days: 7
