name: CLEANUP - Keep only v1.0.104 as Latest
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete releases v1.0.105 - v1.0.113
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for VER in v1.0.105 v1.0.106 v1.0.107 v1.0.108 v1.0.109 v1.0.110 v1.0.111 v1.0.112 v1.0.113; do
            echo "Deleting $VER..."
            gh release delete $VER --yes --cleanup-tag || true
            git push origin --delete $VER || true
          done
          gh release edit v1.0.104 --latest --verify-tag || true
          echo "DONE!"
